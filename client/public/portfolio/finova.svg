  <path d="M 310 220 Q 400 130 480 180 T 720 120" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.8"/>
  <rect x="290" y="280" width="220" height="170" rx="12" fill="#1E293B" opacity="0.6"/>
