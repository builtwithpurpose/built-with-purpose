<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="shop-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="shop-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#shop-bg)"/>
  <!-- Navigation bar mockup -->
  <rect x="50" y="30" width="700" height="50" rx="10" fill="#2E1065"/>
  <rect x="80" y="45" width="100" height="20" rx="4" fill="#A78BFA"/>
  <!-- Product Grid -->
  <rect x="50" y="100" width="215" height="340" rx="12" fill="url(#shop-card)"/>
  <rect x="290" y="100" width="215" height="340" rx="12" fill="url(#shop-card)"/>
  <rect x="530" y="100" width="215" height="340" rx="12" fill="url(#shop-card)"/>
  <text x="400" y="480" font-family="sans-serif" font-size="16" fill="#DDD6FE" text-anchor="middle">ShopEase Next-Gen E-Commerce Platform</text>
</svg>
